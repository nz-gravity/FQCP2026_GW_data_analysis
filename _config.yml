# JupyterBook settings for the FQCP 2026 course.
title: FQCP 2026 GW data analysis
author: Avi Vajpeyi
copyright: "2026"

# Listing myst_enable_extensions replaces JupyterBook's defaults, so the defaults
# are repeated here; deflist is the addition, for the glossary's term/definition
# pairs.  colon_fence keeps the ::: admonitions in the notebooks working.
parse:
  myst_enable_extensions:
    - colon_fence
    - deflist
    - dollarmath
    - linkify
    - substitution
    - tasklist

execute:
  # git holds stripped notebooks; the build pipeline executes them in place just
  # before this step, so the site is rendered from real outputs without those
  # outputs ever entering a commit.  See scripts/prepush_course.sh.
  execute_notebooks: "off"

repository:
  url: https://github.com/nz-gravity/FQCP2026_GW_data_analysis
  path_to_book: ""
  branch: main

launch_buttons:
  colab_url: https://colab.research.google.com
  binderhub_url: ""

html:
  use_issues_button: false
  use_repository_button: true
  home_page_in_sidebar: true

exclude_patterns:
  - _build/**
  - _site/**
  - .venv/**
  - venv/**
  - env/**
  - AGENTS.md
  - README.md
