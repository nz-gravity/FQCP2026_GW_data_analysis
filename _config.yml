# JupyterBook settings for the FQCP 2026 course.
title: FQCP 2026 GW data analysis
author: Avi Vajpeyi
copyright: "2026"

execute:
  # Notebooks are committed WITHOUT outputs; the build executes them.  This keeps
  # ~11 MB of base64 figures out of every commit.  The locked environment already
  # carries the teaching packages, and notebooks/gw150914_cache/ supplies the
  # GWOSC strain, so no external data access is needed.
  execute_notebooks: force
  timeout: 900
  allow_errors: false

repository:
  url: https://github.com/nz-gravity/FQCP2026_GW_data_analysis
  path_to_book: ""
  branch: main

launch_buttons:
  colab_url: https://colab.research.google.com
  binderhub_url: ""

html:
  use_issues_button: false
  use_repository_button: true
  home_page_in_sidebar: true

exclude_patterns:
  - _build/**
  - _site/**
  - .venv/**
  - venv/**
  - env/**
  - README.md
