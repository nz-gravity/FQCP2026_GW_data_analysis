[project]
name = "fqcp2026-gw-data-analysis"
version = "0.1.0"
description = "Colab-first FQCP 2026 gravitational-wave parameter-estimation course"
requires-python = ">=3.12,<3.13"
dependencies = [
  "astropy==7.2.0",
  "bilby==2.8.0",
  "black>=25.1",
  "corner>=2.2",
  "eryn==1.2.6",
  "gpubackendtools==0.1.1",
  "gwpy>=3.0,<4",
  "h5py>=3.11",
  "ipykernel>=6.29",
  "jaxgb==0.2.1",
  "jupyter-book>=1.0,<2.0",
  "jupyterlab>=4.0",
  "jupytext>=1.18,<2",
  "lalsuite==7.26.15",
  # 1.2.5 was the one release in the 1.2.x line published without Linux wheels.
  # 1.2.8 ships cp312 manylinux_2_28 x86_64, which Colab can install, so the
  # LISA notebooks run there and CI can build the site again.
  "lisaanalysistools==1.2.8",
  "matplotlib>=3.8",
  "nbclient>=0.10",
  "numpy>=2.0,<2.4",
  "numpyro==0.21.0",
  "rippleGW==0.2.1",
  "scipy>=1.11",
  "wdm-transform==0.5.0",
]

[tool.uv]
package = false



[tool.jupytext]
notebook_metadata_filter = "colab,kernelspec,language_info,orphan,jupytext"
cell_metadata_filter = "fqcp_figure,jupyter,tags"

[tool.jupytext.formats]
"notebooks/" = "ipynb"
"notebook_sources/" = "py:percent"
