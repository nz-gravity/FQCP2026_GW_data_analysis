[project]
name = "fqcp2026-gw-data-analysis"
version = "0.1.0"
description = "Colab-first FQCP 2026 gravitational-wave parameter-estimation course"
requires-python = ">=3.12,<3.13"
dependencies = [
  "astropy==7.2.0",
  "bilby==2.8.0",
  "black>=25.1",
  "corner>=2.2",
  "eryn==1.2.6",
  "gpubackendtools==0.1.1",
  "gwpy>=3.0,<4",
  "h5py>=3.11",
  "ipykernel>=6.29",
  "jaxgb==0.2.1",
  "jupyter-book>=1.0,<2.0",
  "jupyterlab>=4.0",
  "lalsuite==7.26.15",
  # The published 1.2.5 wheels are macOS-only, so this notebook can only be
  # executed on a Mac.  That is why the course is built and published locally by
  # scripts/prepush_course.sh --publish rather than in CI.
  "lisaanalysistools==1.2.5 ; sys_platform == 'darwin'",
  "matplotlib>=3.8",
  "nbclient>=0.10",
  "numpy>=2.0,<2.4",
  "rippleGW==0.2.1",
  "scipy>=1.11",
  "wdm-transform==0.5.0",
]

[tool.uv]
package = false
