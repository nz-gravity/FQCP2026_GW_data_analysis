name: Validate course notebooks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The site and the reference figures are built and published by
# scripts/prepush_course.sh --publish.  Every dependency now installs on Linux,
# so this is a cost choice rather than a platform constraint: executing the
# course here would cost ~20 minutes a push, and Part 2B downloads public
# GW150914 strain, to reproduce work that already happened locally.  CI checks
# what is cheap and deterministic to check.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: pip install nbformat "jupytext>=1.18,<2"

      # Checks the notebooks are valid, carry no outputs, use $$ delimiters, and
      # still match their Jupytext sources.  Takes seconds and needs none of the
      # scientific stack.
      - name: Validate notebooks
        run: python validate_course.py
