name: Validate course notebooks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The site and the reference figures are built and published from a Mac by
# scripts/prepush_course.sh --publish.  lisaanalysistools ships macOS-only
# wheels, so notebook 02 cannot even be installed on a Linux runner, and
# executing the course here would cost ~20 minutes a push to reproduce work
# that already happened locally.  CI only checks what is cheap to check.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: pip install nbformat "black>=25.1"

      # Checks the notebooks are valid, carry no outputs, use $$ delimiters, and
      # still match build_course.py.  Takes seconds and needs none of the
      # scientific stack.
      - name: Validate notebooks
        run: python validate_course.py
